<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8b477f"><title>Allegra Gestão Pro ERP</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="authGate" class="auth-gate" style="display:none"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">Allegra<small>GRÁFICA</small></div><div><b>Allegra gráfica & personalizados</b><small>Gestão Allegra Pro ERP</small></div></div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">▦ <span>Dashboard & Vendas</span></button>
      <button class="nav-item" data-page="production">◫ <span>Produção e Produtos</span></button>
      <button class="nav-item" data-page="quotes">＄ <span>Calculadora & Orçamentos</span></button>
      <button class="nav-item" data-page="clients">♙ <span>Clientes & Aniversários</span></button>
      <button class="nav-item" data-page="stock">⬡ <span>Estoque de Insumos</span></button>
      <button class="nav-item" data-page="expenses">▤ <span>Despesas do Ateliê</span></button>
      <button class="nav-item" data-page="settings">⚙ <span>Minha Conta</span></button>
    </nav>
    <div class="sidebar-foot">Allegra Gestão Pro · versão inicial</div>
  </aside>
  <main class="main">
    <header class="mobile-head"><button id="menuToggle" class="icon-btn">☰</button><b>Allegra Gestão Pro</b></header>
    <div id="pageContent"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="purchaseDialog"><div class="dialog-head"><b>Registrar compra de insumos</b><button class="icon-btn" type="button" onclick="cancelPurchaseDialog()">✕</button></div><div id="purchaseDialogBody"></div></dialog>
<dialog id="quickStockDialog"><div class="dialog-head"><b>Criar insumo</b><button class="icon-btn" type="button" onclick="document.querySelector('#quickStockDialog').close()">✕</button></div><form id="quickStockForm" class="form-grid"><div class="field span-2"><label>Nome do insumo</label><input name="name" required placeholder="Ex.: Papel fotográfico"></div><div class="field span-2"><label>Custo por unidade (R$)</label><input name="unitCost" type="number" min="0" step="0.01" required placeholder="0,00"></div><div class="form-actions span-2"><button type="button" class="btn light" onclick="document.querySelector('#quickStockDialog').close()">Cancelar</button><button class="btn primary">Criar e usar na compra</button></div></form></dialog>
<dialog id="editOrderDialog"><div class="dialog-head"><b>Editar pedido</b><button class="icon-btn" type="button" onclick="document.querySelector('#editOrderDialog').close()">✕</button></div><div id="editOrderBody"></div></dialog>
<dialog id="clientDialog"><div class="dialog-head"><b>Editar cadastro do cliente</b><button class="icon-btn" type="button" onclick="document.querySelector('#clientDialog').close()">✕</button></div><div id="clientEditBody"></div></dialog>
<dialog id="receiptDialog"><div class="dialog-head"><b>Recibo da venda</b><button class="icon-btn" onclick="document.querySelector('#receiptDialog').close()">✕</button></div><div id="receiptBody"></div><button class="btn primary no-print" onclick="window.print()">Imprimir recibo</button></dialog>
<script src="app.js"></script>
</body></html>
